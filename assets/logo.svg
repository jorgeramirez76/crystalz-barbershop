<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#E8CB7E"/>
      <stop offset="50%" style="stop-color:#C9A961"/>
      <stop offset="100%" style="stop-color:#9A7E3F"/>
    </linearGradient>
  </defs>
  <!-- Decorative razor lines -->
  <line x1="20" y1="60" x2="60" y2="60" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <line x1="340" y1="60" x2="380" y2="60" stroke="url(#goldGrad)" stroke-width="1.5"/>
  <!-- Wordmark -->
  <text x="200" y="68" text-anchor="middle"
        font-family="'Playfair Display', Georgia, serif"
        font-size="48" font-weight="900"
        letter-spacing="6"
        fill="url(#goldGrad)">CRYSTALZ</text>
  <!-- Tagline -->
  <text x="200" y="92" text-anchor="middle"
        font-family="'Inter', system-ui, sans-serif"
        font-size="11" font-weight="500"
        letter-spacing="8"
        fill="#F5EFE0" opacity="0.7">B A R B E R S H O P</text>
  <!-- Star marks -->
  <text x="78" y="68" text-anchor="middle" fill="url(#goldGrad)" font-size="16">★</text>
  <text x="322" y="68" text-anchor="middle" fill="url(#goldGrad)" font-size="16">★</text>
</svg>
